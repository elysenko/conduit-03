# Local development stack for Conduit.
# Mirrors the deployed topology: nginx serves the Angular bundle and proxies
# /api to NestJS over the loopback interface they share in the pod.
#
#   docker compose up --build
#   open http://localhost:4200
services:
  db:
    image: postgres:16
    container_name: conduit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U conduit']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: conduit_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://conduit:conduit@db:5432/conduit
      # Supplied by the platform in real environments; export one locally.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell before docker compose up}
      JWT_EXPIRES_IN: 7d
      PORT: '3001'
      # Consumed by prisma/seed/seed.js. Colossus injects this at provision in
      # every real environment. For a local run, supply it yourself from your
      # shell (it is never committed) — one JSON object per role in the stack
      # contract, each with role/email/password/login_path:
      #   export COLOSSUS_ACCOUNTS_JSON='[{"role":"ADMIN", ...}]'
      # The seed exits 1 when it is absent rather than inventing a login.
      COLOSSUS_ACCOUNTS_JSON: ${COLOSSUS_ACCOUNTS_JSON:?set COLOSSUS_ACCOUNTS_JSON in your shell before docker compose up}
    command: >-
      sh -c "npx prisma migrate deploy && node prisma/seed/seed.js && node dist/main.js"
    ports:
      # 3001: the API directly, 4200: the frontend's nginx (see network_mode below).
      - '3001:3001'
      - '4200:80'

  frontend:
    build:
      context: ./frontend
    container_name: conduit_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Shares the backend's network namespace so nginx can reach the API on
    # 127.0.0.1:3001 exactly as it does inside the deployed pod.
    network_mode: 'service:backend'

volumes:
  postgres_data:
